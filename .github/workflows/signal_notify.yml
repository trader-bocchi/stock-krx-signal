name: Squeeze Momentum Signal Notify

on:
  # ── 한국 시장 스케줄 (KST = UTC+9) ───────────────────────────
  # ※ KR 4H: pykrx는 일봉 전용 → 4H 섹션은 항상 "시그널 없음" 표시
  # 09:00 KST — 장 시작 (4H 스캔)
  # 13:00 KST — 장 중반 (4H 봉 완성 시점)
  # 15:30 KST — 장 마감 (1D 봉 확정)

  # ── 미국 시장 스케줄 (EDT UTC-4 / EST UTC-5) ─────────────────
  # 썸머타임 대응: EDT/EST 공통 커버 가능한 시간대 선택
  # 13:30 UTC — EDT 09:30 ET 개장 / EST 08:30 ET 프리마켓
  # 18:00 UTC — EDT 14:00 ET 4H 중반 / EST 13:00 ET
  # 21:00 UTC — EDT 17:00 ET 마감 후 / EST 16:00 ET 마감

  schedule:
    # KR — pykrx는 일봉 전용이므로 장 마감 후 1회만 실행 (15:30 KST = 06:30 UTC)
    - cron: "30 6 * * 1-5"   # KST 15:30 장 마감 (1D 봉 확정)

    # US — 4H 봉 + 1D 봉 커버를 위해 하루 3회 실행
    - cron: "30 13 * * 1-5"  # EDT 09:30 ET 개장 / KST 22:30
    - cron: "0 18 * * 1-5"   # EDT 14:00 ET 4H 중반 / KST 03:00
    - cron: "0 21 * * 1-5"   # EDT 17:00 ET 마감 후 (1D 봉 확정) / KST 06:00

  workflow_dispatch:
    inputs:
      market:
        description: "스캔 대상 시장 (us / kr / both)"
        required: true
        default: "both"
        type: choice
        options:
          - us
          - kr
          - both

env:
  PYTHON_VERSION: "3.11"
  TZ: "Asia/Seoul"

jobs:
  # ────────────────────────────────────────────────────────────
  # 한국 시장 스캔
  # 트리거: UTC 06:30 (KST 15:30 장 마감 후)
  # pykrx는 일봉 전용 → 4H 섹션은 항상 "시그널 없음"
  # ────────────────────────────────────────────────────────────
  scan-kr:
    name: "KR 시장 스캔"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'schedule' &&
        github.event.schedule == '30 6 * * 1-5'
      ) ||
      (github.event_name == 'workflow_dispatch' && (
        inputs.market == 'kr' || inputs.market == 'both'
      ))

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 캐시 복원
        uses: actions/cache@v4
        with:
          path: data/cache
          key: kr-cache-${{ runner.os }}-${{ hashFiles('config/universe_kr.yaml') }}-${{ github.run_id }}
          restore-keys: |
            kr-cache-${{ runner.os }}-${{ hashFiles('config/universe_kr.yaml') }}-
            kr-cache-${{ runner.os }}-

      - name: KR 시그널 스캔 및 Telegram 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --market kr --mode notify

      - name: 실패 시 에러 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import os, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat  = os.environ["TELEGRAM_CHAT_ID"]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat,
                    "text": "❌ <b>GitHub Actions 실패</b>\nKR 스캔 오류 — Actions 로그를 확인하세요.",
                    "parse_mode": "HTML"},
              timeout=10,
          )
          PYEOF

  # ────────────────────────────────────────────────────────────
  # 미국 시장 스캔
  # 트리거: UTC 13:30 / 18:00 / 21:00 (EDT 기준 09:30 / 14:00 / 17:00 ET)
  # ────────────────────────────────────────────────────────────
  scan-us:
    name: "US 시장 스캔"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'schedule' && (
        github.event.schedule == '30 13 * * 1-5' ||
        github.event.schedule == '0 18 * * 1-5'  ||
        github.event.schedule == '0 21 * * 1-5'
      )) ||
      (github.event_name == 'workflow_dispatch' && (
        inputs.market == 'us' || inputs.market == 'both'
      ))

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 캐시 복원
        uses: actions/cache@v4
        with:
          path: data/cache
          key: us-cache-${{ runner.os }}-${{ hashFiles('config/universe_us.yaml') }}-${{ github.run_id }}
          restore-keys: |
            us-cache-${{ runner.os }}-${{ hashFiles('config/universe_us.yaml') }}-
            us-cache-${{ runner.os }}-

      - name: US 시그널 스캔 및 Telegram 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --market us --mode notify

      - name: 실패 시 에러 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import os, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat  = os.environ["TELEGRAM_CHAT_ID"]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat,
                    "text": "❌ <b>GitHub Actions 실패</b>\nUS 스캔 오류 — Actions 로그를 확인하세요.",
                    "parse_mode": "HTML"},
              timeout=10,
          )
          PYEOF
