name: ETF 수익률 리포트

on:
  # KST 08:00 평일 오전 전송 (UTC 23:00 전날 → 월~금 KST)
  schedule:
    - cron: "0 23 * * 0-4"

  # 수동 실행
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  TZ: "Asia/Seoul"

jobs:
  etf-report:
    name: "ETF 수익률 리포트 전송"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: ETF 리포트 생성 및 Telegram 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python etf_report.py

      - name: 실패 시 에러 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import os, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat  = os.environ["TELEGRAM_CHAT_ID"]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat,
                    "text": "❌ <b>GitHub Actions 실패</b>\nETF 리포트 오류 — Actions 로그를 확인하세요.",
                    "parse_mode": "HTML"},
              timeout=10,
          )
          PYEOF
